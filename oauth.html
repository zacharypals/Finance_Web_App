<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f4f6f5; color: #1d2a24; }
  @media (prefers-color-scheme: dark) { body { background: #121815; color: #e6ece9; } }
</style>
<script src="config.js"></script>
</head>
<body>
<p id="msg">Signing in…</p>
<script>
// Google redirects here with ?code=…&state=… (full-page redirect flow, which also
// works inside an installed iPhone home-screen app, unlike popups).
(async function () {
  const C = window.FP_CONFIG, K = window.FP_KEYS;
  const params = new URLSearchParams(location.search);
  const goHome = () => location.replace('./');
  const fail = (code) => { try { localStorage.setItem(K.authError, code); } catch (e) {} goHome(); };

  if (params.get('error')) return fail(params.get('error'));

  let expected = null;
  try {
    const saved = JSON.parse(localStorage.getItem(K.oauthState) || 'null');
    localStorage.removeItem(K.oauthState);
    if (saved && Date.now() - saved.t < 10 * 60 * 1000) expected = saved.v;
  } catch (e) {}
  if (!params.get('code') || !expected || params.get('state') !== expected) return fail('state_mismatch');

  try {
    const res = await fetch(C.API_URL + '/auth/exchange', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: params.get('code'), redirect_uri: C.REDIRECT_URI }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error || !data.session_token) return fail(data.error || 'exchange_failed');
    localStorage.setItem(K.session, data.session_token);
    localStorage.setItem(K.email, data.email);
    goHome();
  } catch (e) {
    fail('network_error');
  }
})();
</script>
</body>
</html>
