<!-- Finance Pal v0.5.2 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Pal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#174f3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance Pal">
<script src="config.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f4f6f5;
  --paper: #ffffff;
  --ink: #1d2a24;
  --ink-light: #5f6f67;
  --ink-faint: #a9b5af;
  --border: #e1e7e4;
  --accent: #1f6f54;
  --accent-dark: #174f3c;
  --accent-light: #e6f2ec;
  --gold: #b8860b;
  --red: #c8463a;
  --red-light: #fbeceb;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --shadow: 0 1px 3px rgba(20, 40, 30, .08);
  --nav-h: 56px;
  --chart-line: #16805a;   /* validated: chroma/contrast pass on light surface */
  --chart-grid: #e8ecea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121815; --paper: #1a221e; --ink: #e6ece9; --ink-light: #a3b0a9; --ink-faint: #5d6a63;
    --border: #2a3530; --accent: #3fa37c; --accent-dark: #174f3c; --accent-light: #1d2f27;
    --red: #e0675b; --red-light: #3a2220;
    --chart-line: #3fa37c; /* validated on dark surface */
    --chart-grid: #26302b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 16px;
  padding: calc(env(safe-area-inset-top) + 10px) 20px 10px; color: #fff;
  background: linear-gradient(135deg, #174f3c 0%, #1f6f54 100%); }
.brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; white-space: nowrap; }
.brand .ver { font-weight: 500; font-size: 11px; opacity: .7; margin-left: 6px; }
.tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
.tab { background: none; border: 0; color: rgba(255,255,255,.75); padding: 8px 12px; border-radius: var(--radius-sm); white-space: nowrap; }
.tab:hover { background: rgba(255,255,255,.1); color: #fff; }
.tab.active { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
.user { display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap; }
.btn-ghost { background: rgba(255,255,255,.14); color: #fff; border: 0; padding: 6px 12px; border-radius: var(--radius-sm); }
.btn-ghost:hover { background: rgba(255,255,255,.24); }

/* Content */
main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 40px; }
.card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 12px; }
.muted { color: var(--ink-light); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.checklist li:last-child { border-bottom: 0; }
.ok { color: var(--accent); font-weight: 700; }
.pending { color: var(--ink-faint); font-weight: 700; }
.phase-pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-light); color: var(--accent); font-weight: 600; }

/* Connections (Phase 1) */
.row-between { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-inline { width: auto; padding: 8px 14px; font-size: 14px; }
.btn-secondary { background: var(--accent-light); color: var(--accent); border: 1px solid transparent; padding: 8px 14px; border-radius: var(--radius-md); font-weight: 600; font-size: 14px; }
.btn-secondary:hover { border-color: var(--accent); }
.btn-text { background: none; border: 0; color: var(--ink-light); padding: 8px 6px; font-size: 14px; }
.btn-text:hover { color: var(--red); }
button:disabled { opacity: .55; cursor: default; }
.conn { border-top: 1px solid var(--border); padding: 16px 0 4px; margin-top: 16px; }
.conn-name { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.pill-ok { background: var(--accent-light); color: var(--accent); }
.pill-warn { background: #fdf3dc; color: #8a6200; }
.pill-err { background: var(--red-light); color: var(--red); }
.pill-muted { background: var(--bg); color: var(--ink-light); }
.acct-list { margin-top: 10px; }
.acct-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.acct-row:last-child { border-bottom: 0; }
.acct-main { flex: 1; min-width: 0; }
.acct-name { font-weight: 500; }
.btn-primary.btn-inline { width: auto; }
.editor input[type=text], .editor select { max-width: 380px; }
.acct-meta { font-size: 12.5px; }
.acct-bal { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ok-box { background: var(--accent-light); color: var(--accent); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; margin: 12px 0; }
.warn-box { background: #fdf3dc; color: #8a6200; border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; margin-top: 8px; }
@media (prefers-color-scheme: dark) {
  .pill-warn, .warn-box { background: #3a3018; color: #e8c46a; }
}

/* Accounts (Phase 2) */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; box-shadow: var(--shadow); }
.tile-label { font-size: 12.5px; color: var(--ink-light); }
.tile-value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile-hero .tile-value { font-size: 28px; }
.seg { display: inline-flex; background: var(--bg); border-radius: var(--radius-sm); padding: 2px; }
.seg button { background: none; border: 0; padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--ink-light); }
.seg button.active { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.chart-box { position: relative; height: 240px; margin-top: 12px; }
.empty-note { color: var(--ink-light); font-size: 14px; padding: 28px 8px; text-align: center; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
.group-head h2 { margin: 0; font-size: 15px; }
.group-head .sub { font-variant-numeric: tabular-nums; font-weight: 600; }
.acct-click { cursor: pointer; }
.acct-click:hover { background: var(--bg); }
.acct-row.dim { opacity: .55; }
.acct-row input[type=checkbox] { width: 18px; height: 18px; margin: 2px 10px 0 0; flex: none; }
.star { background: none; border: 0; font-size: 16px; color: var(--ink-faint); padding: 0 6px; line-height: 1; }
.star.on { color: var(--gold); }
.editor { background: var(--bg); border-radius: var(--radius-md); padding: 14px; margin: 4px 0 10px; display: grid; gap: 10px; }
.editor label { font-size: 13px; color: var(--ink-light); display: grid; gap: 4px; }
.editor .checks { display: flex; gap: 16px; flex-wrap: wrap; }
.editor .checks label { display: flex; align-items: center; gap: 6px; color: var(--ink); }
input[type=text], input[type=date], input[type=number], select {
  font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--paper); color: var(--ink); }
.bulkbar { position: sticky; top: 64px; z-index: 50; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: var(--ink); color: var(--paper); padding: 10px 12px; border-radius: var(--radius-md); margin: 12px 0; }
.bulkbar button, .bulkbar select { font-size: 13px; padding: 6px 10px; border-radius: var(--radius-sm); border: 0; }
.levels { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.levels th, .levels td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
.levels th:first-child, .levels td:first-child { text-align: left; white-space: normal; }
.levels thead th { font-size: 12px; color: var(--ink-light); font-weight: 600; }
.levels tfoot td { font-weight: 700; border-bottom: 0; }
.levels .asof { display: block; font-size: 11px; color: var(--ink-faint); }
.table-scroll { overflow-x: auto; margin: 0 -4px; }
.holdings { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.holdings td, .holdings th { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: right; }
.holdings td:first-child, .holdings th:first-child { text-align: left; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-top: 12px; }
.inline-form label { font-size: 12px; color: var(--ink-light); display: grid; gap: 4px; }

/* Transactions & reports (Phase 3) */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.filters select { max-width: 200px; }
.check-inline { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-light); }
.tx-date { font-size: 12px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: .4px; padding: 14px 0 4px; border-bottom: 1px solid var(--border); }
.tx-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.tx-row:hover { background: var(--bg); }
.tx-row.dim { opacity: .6; }
.tx-row input[type=checkbox] { width: 18px; height: 18px; flex: none; }
.tx-main { flex: 1; min-width: 0; }
.tx-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-cat select { max-width: 170px; font-size: 13px; padding: 5px 8px; }
.tx-amt { width: 100px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.amt-in { color: var(--accent); font-weight: 600; }
.amt-xfer { color: var(--ink-light); font-weight: 400; }
.rule-prompt { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-light); border-radius: var(--radius-md); padding: 10px 12px; margin: 12px 0; font-size: 14px; }
.rule-prompt input { min-width: 160px; }
.period-nav { display: flex; align-items: center; gap: 6px; }
.period-nav .btn-text { font-size: 22px; line-height: 1; padding: 2px 10px; }
.rep-group { margin-bottom: 8px; }
.rep-row { display: grid; grid-template-columns: minmax(110px, 200px) 1fr 100px; gap: 12px; align-items: center; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
.rep-row:hover { background: var(--bg); }
.rep-parent .rep-label { font-weight: 600; }
.rep-child .rep-label { padding-left: 16px; color: var(--ink-light); font-size: 14px; }
.rep-val { text-align: right; font-variant-numeric: tabular-nums; }
.rep-bar { height: 10px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.rep-bar span { display: block; height: 100%; background: var(--chart-line); border-radius: 0 4px 4px 0; }
.rep-child .rep-bar span { opacity: .55; }
.month-bars { display: flex; align-items: flex-end; gap: 6px; height: 180px; padding-top: 8px; }
.mbar { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; position: relative; cursor: default; }
.mbar-track { flex: 1; width: 100%; max-width: 44px; display: flex; align-items: flex-end; }
.mbar-fill { width: 100%; background: var(--chart-line); border-radius: 4px 4px 0 0; min-height: 2px; }
.mbar-label { font-size: 11px; color: var(--ink-light); margin-top: 4px; }
.mbar:hover .mbar-fill { filter: brightness(1.15); }
.mbar[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap;
  background: var(--ink); color: var(--paper); font-size: 12px; padding: 6px 8px; border-radius: 6px; z-index: 5; pointer-events: none; }
.mbar:first-child[data-tip]:hover::after { left: 0; transform: none; }
.mbar:last-child[data-tip]:hover::after { left: auto; right: 0; transform: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: var(--bg); border: 1px solid var(--border); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.chip:hover { border-color: var(--accent); }
.chip-add { color: var(--accent); border-style: dashed; }
.chip.editing { padding: 3px 6px; }
.chip.editing input { padding: 4px 8px; font-size: 13px; width: 150px; }
@media (max-width: 767px) {
  .tx-row { flex-wrap: wrap; }
  .tx-main { flex-basis: calc(100% - 112px); }
  .tx-cat { order: 3; flex-basis: 100%; }
  .tx-cat select { max-width: 100%; width: 100%; }
  .rep-row { grid-template-columns: 1fr 90px; }
  .rep-bar { grid-column: 1 / -1; grid-row: 2; }
  .filters select, .filters input[type=text] { flex: 1 1 45%; max-width: none; }
}

/* Plan (Phase 4) */
.moves { display: grid; gap: 2px; margin-top: 10px; }
.move { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 14px; cursor: pointer; }
.move input { width: 18px; height: 18px; }
.move-amt { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 80px; }
.move-done > span:not(.muted) { color: var(--ink-light); text-decoration: line-through; }
.fund-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.fund-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; display: grid; gap: 6px; align-content: start; }
.fund-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fund-bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin: 4px 0; }
.fund-bar span { display: block; height: 100%; background: var(--chart-line); border-radius: 0 4px 4px 0; }
.fund-bar span.short { background: var(--gold); }
.fund-nums { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-size: 14px; }
.fund-nums .muted { font-size: 12px; margin-right: 4px; }
.plan { border-collapse: separate; border-spacing: 0; font-size: 13.5px; font-variant-numeric: tabular-nums; min-width: 100%; }
.plan th, .plan td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--paper); }
.plan thead th { font-size: 12px; color: var(--ink-light); font-weight: 600; padding: 8px 6px; }
.plan .sticky { position: sticky; left: 0; z-index: 1; text-align: left; min-width: 150px; max-width: 190px; white-space: normal; }
.plan th.cur, .plan td.cur { background: var(--accent-light); }
.plan th.past { color: var(--ink-faint); }
.plan .now { color: var(--ink-light); }
.plan-group td { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--ink-light); padding-top: 12px; }
.plan .cell { width: 72px; text-align: right; border: 1px solid transparent; background: transparent; padding: 5px 6px; color: var(--ink-light); font-size: 13.5px; }
.plan .cell:hover { border-color: var(--border); }
.plan .cell:focus { border-color: var(--accent); background: var(--paper); color: var(--ink); outline: none; }
.plan .cell.override { color: var(--ink); font-weight: 600; }
.plan td.done .cell { text-decoration: line-through; text-decoration-color: var(--ink-faint); }
.plan tfoot td { font-weight: 600; }
.plan tfoot tr.left td { border-bottom: 0; }
.plan td.neg { color: var(--red); }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 500; text-align: left; }
.linkish:hover { color: var(--accent); text-decoration: underline; }
.plan .asof { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 400; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.form-grid input, .form-grid select { width: 100%; max-width: none; }

/* Bottom nav (mobile) */
.bottomnav { display: none; }
@media (max-width: 767px) {
  .tabs, .user .email { display: none; }
  .topbar { justify-content: space-between; }
  main { padding: 16px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); }
  .bottomnav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: var(--paper); border-top: 1px solid var(--border); }
  .bottomnav button { flex: 1; background: none; border: 0; color: var(--ink-light); font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .bottomnav button .ico { font-size: 18px; }
  .bottomnav button.active { color: var(--accent); font-weight: 600; }
}

/* Auth overlays — always on top (same rule as LP Planner) */
.overlay { position: fixed; inset: 0; z-index: 20000; display: grid; place-items: center; padding: 20px; background: var(--bg); }
.signin { width: 100%; max-width: 380px; text-align: center; }
.signin .logo { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 16px; display: block; }
.btn-primary { width: 100%; background: var(--accent); color: #fff; border: 0; padding: 12px 16px; border-radius: var(--radius-md); font-weight: 600; font-size: 15px; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .6; cursor: default; }
.error-box { background: var(--red-light); color: var(--red); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; margin-bottom: 14px; text-align: left; }
.spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Persistent error toast — no dismiss button; disappears only when the retry succeeds */
.error-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 15000;
  display: flex; align-items: center; gap: 12px; max-width: calc(100% - 28px);
  background: var(--ink); color: var(--paper); padding: 10px 12px 10px 16px; border-radius: var(--radius-md); box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 14px; }
.error-toast button { background: var(--paper); color: var(--ink); border: 0; padding: 6px 12px; border-radius: var(--radius-sm); font-weight: 600; white-space: nowrap; }
@media (max-width: 767px) { .error-toast { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;
const APP_VERSION = '0.5.2';
const C = window.FP_CONFIG, K = window.FP_KEYS;

// ─────────────────────────────────────────────
// SESSION + API
// ─────────────────────────────────────────────
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { console.warn('localStorage write failed', k, e); } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { console.warn('localStorage remove failed', k, e); } }

const getSession = () => lsGet(K.session);
function clearSession() { lsDel(K.session); lsDel(K.email); }

class AuthError extends Error {
  constructor(code) { super(code); this.code = code; }
}

// Every Worker call goes through here. 401/403 → AuthError (shows the sign-in wall).
async function api(path, opts = {}) {
  const token = getSession();
  if (!token) throw new AuthError('unauthenticated');
  let res;
  try {
    res = await fetch(C.API_URL + path, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) },
    });
  } catch (e) {
    throw new Error('Can’t reach the server. Check your connection.');
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 || res.status === 403) {
    clearSession();
    window.dispatchEvent(new CustomEvent('fp-auth-lost', { detail: data.error || 'unauthenticated' }));
    throw new AuthError(data.error || 'unauthenticated');
  }
  if (!res.ok) {
    const err = new Error(data.message || data.error || ('Request failed (' + res.status + ')'));
    err.code = data.code || data.error;
    throw err;
  }
  return data;
}

// ─────────────────────────────────────────────
// FORMATTING
// ─────────────────────────────────────────────
const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const fmtCents = (c) => (c === null || c === undefined ? '—' : usd.format(c / 100));
function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function fmtAgo(ms) {
  if (!ms) return 'never';
  const mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' hr ago';
  return Math.round(hrs / 24) + ' days ago';
}

// ─────────────────────────────────────────────
// PLAID LINK
// ─────────────────────────────────────────────
// Opens Plaid Link. `ctx` = { type: 'bank'|'investment' } for a new connection, or { itemId } to reconnect.
// Saved to localStorage so a bank OAuth round-trip (Chase, Wells) can resume via plaid-oauth.html.
function launchPlaidLink(token, ctx, { receivedRedirectUri, onDone, onError }) {
  if (!window.Plaid) { onError('Plaid Link didn’t load. Check your connection or ad blocker and reload.'); return; }
  const handler = window.Plaid.create({
    token,
    receivedRedirectUri: receivedRedirectUri || undefined,
    onSuccess: async (publicToken, metadata) => {
      lsDel(K.plaidLink); lsDel(K.plaidRedirect);
      try {
        if (ctx.itemId) {
          await api('/api/items/' + ctx.itemId + '/reconnected', { method: 'POST' });
          onDone('Reconnected.');
        } else {
          const r = await api('/api/plaid/exchange', {
            method: 'POST',
            body: JSON.stringify({ public_token: publicToken, type: ctx.type, institution: metadata.institution }),
          });
          onDone(r.institution_name + ' linked' + (r.sync_error ? ' — first sync will retry (' + r.sync_error + ')' : '.'));
        }
      } catch (e) {
        if (!(e instanceof AuthError)) onError(e.message);
      }
    },
    onExit: (err) => {
      lsDel(K.plaidLink); lsDel(K.plaidRedirect);
      if (err) onError(err.display_message || err.error_message || err.error_code || 'Linking was interrupted.');
      else onDone(null);
    },
  });
  handler.open();
}

async function startPlaidLink(ctx, callbacks) {
  try {
    const r = await api('/api/plaid/link-token', {
      method: 'POST',
      body: JSON.stringify(ctx.itemId ? { item_id: ctx.itemId } : { type: ctx.type }),
    });
    lsSet(K.plaidLink, JSON.stringify({ token: r.link_token, ...ctx, t: Date.now() }));
    launchPlaidLink(r.link_token, ctx, callbacks);
  } catch (e) {
    if (!(e instanceof AuthError)) callbacks.onError(e.message);
  }
}

function startSignIn() {
  const bytes = new Uint8Array(16); crypto.getRandomValues(bytes);
  const state = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  lsSet(K.oauthState, JSON.stringify({ v: state, t: Date.now() }));
  const params = new URLSearchParams({
    client_id: C.GOOGLE_CLIENT_ID,
    redirect_uri: C.REDIRECT_URI,
    response_type: 'code',
    scope: 'openid email profile',
    prompt: 'select_account',
    state,
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

function Connections({ onChanged }) {
  const [items, setItems] = useState(null);
  const [busy, setBusy] = useState(null);          // item id, 'link', or null
  const [notice, setNotice] = useState(null);       // { kind: 'ok'|'err', text }

  const load = useCallback(async () => {
    try {
      const r = await api('/api/items');
      setItems(r.items);
    } catch (e) {
      if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: 'Couldn’t load connections: ' + e.message });
    }
  }, []);

  const callbacks = {
    onDone: (msg) => { setBusy(null); if (msg) setNotice({ kind: 'ok', text: msg }); load(); onChanged && onChanged(); },
    onError: (msg) => { setBusy(null); setNotice({ kind: 'err', text: msg }); load(); },
  };

  useEffect(() => {
    load();
    // Returning from a bank's OAuth page: resume the same Link session.
    const params = new URLSearchParams(location.search);
    if (params.get('plaid_oauth')) {
      history.replaceState(null, '', location.pathname);
      let saved = null;
      try { saved = JSON.parse(lsGet(K.plaidLink) || 'null'); } catch (e) { console.warn('Bad saved Link state', e); }
      const redirect = lsGet(K.plaidRedirect);
      if (saved && redirect && Date.now() - saved.t < 30 * 60 * 1000) {
        setBusy('link');
        launchPlaidLink(saved.token, saved, { ...callbacks, receivedRedirectUri: redirect });
      } else {
        setNotice({ kind: 'err', text: 'The bank sent you back, but the linking session was lost (this can happen if you switched browsers or apps). Please start linking again from this device’s browser.' });
      }
    }
  }, []);

  async function syncNow(item, full) {
    setBusy(item.id); setNotice(null);
    try {
      let more = true, rounds = 0, added = 0;
      while (more && rounds < 15) {
        const r = await api('/api/items/' + item.id + '/sync', { method: 'POST', body: JSON.stringify({ full: full && rounds === 0 }) });
        more = r.more; added += r.added; rounds++;
      }
      setNotice({ kind: 'ok', text: item.institution_name + ' synced' + (added ? ' — ' + added + ' new transactions.' : '.') + (more ? ' More history is still loading; sync again shortly.' : '') });
    } catch (e) {
      if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: item.institution_name + ': ' + e.message });
    } finally {
      setBusy(null); load(); onChanged && onChanged();
    }
  }

  async function remove(item) {
    if (!window.confirm('Remove ' + item.institution_name + '? This deletes its accounts and transactions from Finance Pal and disconnects it from Plaid.')) return;
    setBusy(item.id); setNotice(null);
    try {
      await api('/api/items/' + item.id, { method: 'DELETE' });
      setNotice({ kind: 'ok', text: item.institution_name + ' removed.' });
    } catch (e) {
      if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: e.message });
    } finally {
      setBusy(null); load(); onChanged && onChanged();
    }
  }

  return (
    <div className="card">
      <div className="row-between">
        <div>
          <h1>Bank connections</h1>
          <p className="muted" style={{ marginTop: 0 }}>Read-only access through Plaid. Each bank login uses one of your 10 free connections.</p>
        </div>
        <div className="btn-row">
          <button className="btn-primary btn-inline" disabled={!!busy} onClick={() => { setBusy('link'); setNotice(null); startPlaidLink({ type: 'bank' }, callbacks); }}>+ Bank or card</button>
          <button className="btn-secondary" disabled={!!busy} onClick={() => { setBusy('link'); setNotice(null); startPlaidLink({ type: 'investment' }, callbacks); }}>+ Investment account</button>
        </div>
      </div>

      {notice && <div className={notice.kind === 'err' ? 'error-box' : 'ok-box'}>{notice.text}</div>}
      {items === null && <div className="spinner" style={{ margin: '24px auto' }} />}
      {items && items.length === 0 && <p className="muted">No banks linked yet. Use <b>+ Bank or card</b> for Chase, Wells Fargo and SoFi, and <b>+ Investment account</b> for Robinhood.</p>}

      {items && items.map(item => {
        const st = STATUS_LABEL[item.status] || STATUS_LABEL.error;
        const needsReconnect = item.status === 'login_required' || ITEM_NOTICE[item.error_code];
        const txText = TX_STATUS_TEXT[item.tx_status];
        return (
          <div className="conn" key={item.id}>
            <div className="row-between">
              <div>
                <div className="conn-name">{item.institution_name} <span className={'pill ' + st.cls}>{st.text}</span>
                  {item.link_type === 'investment' && <span className="pill pill-muted">investments</span>}</div>
                <div className="muted acct-meta">Last synced {fmtAgo(item.last_synced_at)}{item.status === 'error' && item.error_code ? ' · ' + item.error_code : ''}</div>
              </div>
              <div className="btn-row">
                {needsReconnect && <button className="btn-primary btn-inline" disabled={!!busy} onClick={() => { setBusy(item.id); setNotice(null); startPlaidLink({ itemId: item.id }, callbacks); }}>Reconnect</button>}
                <button className="btn-secondary" disabled={!!busy} onClick={() => syncNow(item, true)}>{busy === item.id ? 'Working…' : 'Sync now'}</button>
                <button className="btn-text" disabled={!!busy} onClick={() => remove(item)}>Remove</button>
              </div>
            </div>
            {ITEM_NOTICE[item.error_code] && <div className="warn-box">{ITEM_NOTICE[item.error_code]}</div>}
            {txText && <div className="muted acct-meta" style={{ marginTop: 6 }}>{txText}</div>}
            <div className="acct-list">
              {item.accounts.length === 0 && <div className="muted acct-meta">No accounts yet.</div>}
              {item.accounts.map(a => <AccountRow key={a.id} a={a} />)}
            </div>
          </div>
        );
      })}
      <p className="muted acct-meta" style={{ marginTop: 16, marginBottom: 0 }}>
        Tip: link banks from a regular browser tab on your computer. Banks that send you to their own site to approve (Chase, Wells Fargo) can lose track of an installed home-screen app.
      </p>
    </div>
  );
}

const GROUPS = [
  { key: 'cash', label: 'Cash' },
  { key: 'vault', label: 'Vaults' },
  { key: 'credit', label: 'Credit cards' },
  { key: 'investment', label: 'Investments' },
  { key: 'loan', label: 'Loans' },
  { key: 'other', label: 'Other' },
];
const isLiabilityGroup = (g) => g === 'credit' || g === 'loan';
const acctName = (a) => a.display_name || a.name;
const usdCompact = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 1 });
const counts = (a) => !a.hidden && a.include_in_net_worth;
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  const label = new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'short' }) + ' 1';
  return y === new Date().getFullYear() ? label : label + ' ’' + String(y).slice(2);
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function NetWorthChart({ series }) {
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);
  useEffect(() => {
    if (!window.Chart || !canvasRef.current || series.length < 2) return;
    const ink = cssVar('--ink-light'), grid = cssVar('--chart-grid'), line = cssVar('--chart-line');
    chartRef.current = new window.Chart(canvasRef.current, {
      type: 'line',
      data: {
        labels: series.map(s => s.date),
        datasets: [{ label: 'Net worth', data: series.map(s => s.net / 100), borderColor: line, backgroundColor: line,
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 12, tension: 0.15 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            title: (items) => fmtDate(items[0].label),
            label: (item) => ' ' + usd.format(item.parsed.y),
          } },
        },
        scales: {
          x: { grid: { display: false }, border: { color: grid },
               ticks: { color: ink, maxTicksLimit: 6, maxRotation: 0, callback: function (v) { return fmtDate(this.getLabelForValue(v)); } } },
          y: { grid: { color: grid }, border: { display: false },
               ticks: { color: ink, maxTicksLimit: 5, callback: (v) => usdCompact.format(v) } },
        },
      },
    });
    return () => { chartRef.current && chartRef.current.destroy(); chartRef.current = null; };
  }, [series]);

  if (!window.Chart && series.length >= 2) return <div className="empty-note">The chart library didn’t load — check your connection and reload.</div>;
  if (series.length < 2) {
    return <div className="empty-note">The chart starts filling in tomorrow. Finance Pal records every balance once a day{series.length === 1 ? ' — today’s net worth is ' + fmtCents(series[0].net) : ''}.</div>;
  }
  return <div className="chart-box"><canvas ref={canvasRef} role="img" aria-label={'Net worth over time, latest ' + fmtCents(series[series.length - 1].net)} /></div>;
}

function Holdings({ accountId }) {
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    api('/api/accounts/' + accountId + '/holdings')
      .then(r => setRows(r.holdings))
      .catch(e => { if (!(e instanceof AuthError)) setErr(e.message); });
  }, [accountId]);
  if (err) return <div className="error-box">{err}</div>;
  if (!rows) return <div className="muted acct-meta">Loading holdings…</div>;
  if (!rows.length) return <div className="muted acct-meta">No holdings reported.</div>;
  const total = rows.reduce((s, h) => s + (h.value || 0), 0);
  return (
    <div className="table-scroll">
      <table className="holdings">
        <thead><tr><th>Holding</th><th>Shares</th><th>Price</th><th>Value</th><th>% of acct</th></tr></thead>
        <tbody>{rows.map((h, i) => (
          <tr key={i}>
            <td><b>{h.ticker && !h.ticker.startsWith('CUR:') ? h.ticker : (h.type === 'cash' || (h.ticker || '').startsWith('CUR:') ? 'Cash' : '')}</b> <span className="muted">{h.name && h.ticker !== h.name ? h.name : ''}</span></td>
            <td>{h.quantity !== null && h.type !== 'cash' ? Number(h.quantity).toLocaleString('en-US', { maximumFractionDigits: 4 }) : ''}</td>
            <td>{h.type !== 'cash' ? fmtCents(h.price) : ''}</td>
            <td>{fmtCents(h.value)}</td>
            <td>{total ? Math.round((h.value || 0) / total * 1000) / 10 + '%' : ''}</td>
          </tr>))}
        </tbody>
      </table>
    </div>
  );
}

function AccountEditor({ a, onSaved, onError }) {
  const [form, setForm] = useState({
    display_name: a.display_name || '', account_group: a.grp,
    include_in_net_worth: !!a.include_in_net_worth, hidden: !!a.hidden, track_levels: !!a.track_levels,
    visibility: a.visibility,
  });
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  async function save() {
    setSaving(true);
    try {
      await api('/api/accounts/' + a.id, { method: 'PATCH', body: JSON.stringify({ ...form, display_name: form.display_name.trim() || null }) });
      onSaved('Saved ' + (form.display_name.trim() || a.name) + '.');
    } catch (e) {
      if (!(e instanceof AuthError)) onError(e.message);
    } finally { setSaving(false); }
  }
  return (
    <div className="editor" onClick={e => e.stopPropagation()}>
      {!a.is_mine && <div className="muted acct-meta">Shared with you by its owner — only they can change its settings.</div>}
      {a.is_mine && <>
        <label>Name <input type="text" value={form.display_name} placeholder={a.name} maxLength={60} onChange={e => set('display_name', e.target.value)} /></label>
        <label>Group
          <select value={form.account_group} onChange={e => set('account_group', e.target.value)}>
            {GROUPS.map(g => <option key={g.key} value={g.key}>{g.label}</option>)}
          </select>
        </label>
        <div className="checks">
          <label><input type="checkbox" checked={form.include_in_net_worth} onChange={e => set('include_in_net_worth', e.target.checked)} /> Count in net worth</label>
          <label><input type="checkbox" checked={form.track_levels} onChange={e => set('track_levels', e.target.checked)} /> Show in monthly levels</label>
          <label><input type="checkbox" checked={form.hidden} onChange={e => set('hidden', e.target.checked)} /> Hide everywhere</label>
          <label><input type="checkbox" checked={form.visibility === 'household'} onChange={e => set('visibility', e.target.checked ? 'household' : 'private')} /> Share with household</label>
        </div>
        <div className="btn-row"><button className="btn-primary btn-inline" disabled={saving} onClick={save}>{saving ? 'Saving…' : 'Save'}</button></div>
      </>}
      {a.type === 'investment' && <Holdings accountId={a.id} />}
      <div className="muted acct-meta">{a.institution_name}{a.official_name ? ' · ' + a.official_name : ''} · balance as of {fmtDate(a.balance_date)}</div>
    </div>
  );
}

function MonthlyLevels({ accounts, levels, onChanged, onError }) {
  const tracked = accounts.filter(a => !a.hidden && a.track_levels);
  const rows = tracked.length ? tracked : accounts.filter(a => !a.hidden && (a.grp === 'vault' || a.grp === 'investment'));
  const firstWithData = levels.months.findIndex(m => rows.some(a => (levels.values[a.id] || {})[m]));
  const months = firstWithData === -1 ? [] : levels.months.slice(firstWithData);
  const [form, setForm] = useState({ account: '', date: '', amount: '' });
  const [saving, setSaving] = useState(false);

  const cell = (a, m) => (levels.values[a.id] || {})[m];
  const signed = (a, v) => (isLiabilityGroup(a.grp) ? -v : v);
  const colTotal = (m) => rows.some(a => cell(a, m)) ? rows.reduce((s, a) => { const c = cell(a, m); return c ? s + signed(a, c.current || 0) : s; }, 0) : null;
  const nowTotal = rows.reduce((s, a) => s + signed(a, a.current || 0), 0);

  async function addPast(e) {
    e.preventDefault();
    const cents = Math.round(parseFloat(String(form.amount).replace(/[$,]/g, '')) * 100);
    if (!form.account || !form.date || !Number.isFinite(cents)) { onError('Pick an account, a date and an amount.'); return; }
    setSaving(true);
    try {
      await api('/api/accounts/' + form.account + '/balances', { method: 'POST', body: JSON.stringify({ date: form.date, current_cents: cents }) });
      setForm({ account: '', date: '', amount: '' });
      onChanged('Past balance added.');
    } catch (err) {
      if (!(err instanceof AuthError)) onError(err.message);
    } finally { setSaving(false); }
  }

  return (
    <div className="card">
      <h2>Monthly levels</h2>
      <p className="muted acct-meta" style={{ marginTop: -6 }}>
        Balance at the start of each month.{months.length === 0 ? ' Columns appear from the 1st of next month, or add a past balance below (for example your Oct 1 numbers).' : ''} {tracked.length ? '' : 'Showing vaults and investments — click ☆ on any account to choose exactly which appear here.'}
      </p>
      {rows.length === 0 ? <div className="empty-note">No accounts to show yet.</div> : (
        <div className="table-scroll">
          <table className="levels">
            <thead><tr><th>Account</th>{months.map(m => <th key={m}>{monthLabel(m)}</th>)}<th>Now</th></tr></thead>
            <tbody>{rows.map(a => (
              <tr key={a.id}>
                <td>{acctName(a)}</td>
                {months.map(m => {
                  const c = cell(a, m);
                  if (!c) return <td key={m} className="muted">—</td>;
                  const late = !c.date.endsWith('-01');
                  return <td key={m} title={c.source === 'manual' ? 'Entered by hand' : ''}>
                    {fmtCents(c.current)}{c.source === 'manual' ? ' ✎' : ''}
                    {late && <span className="asof">as of {fmtDate(c.date)}</span>}
                  </td>;
                })}
                <td>{fmtCents(a.current)}</td>
              </tr>))}
            </tbody>
            <tfoot><tr><td>Total</td>{months.map(m => <td key={m}>{fmtCents(colTotal(m))}</td>)}<td>{fmtCents(nowTotal)}</td></tr></tfoot>
          </table>
        </div>
      )}
      <form className="inline-form" onSubmit={addPast}>
        <label>Add a past balance
          <select value={form.account} onChange={e => setForm(f => ({ ...f, account: e.target.value }))}>

            {accounts.filter(a => a.is_mine && !a.hidden).map(a => <option key={a.id} value={a.id}>{acctName(a)}</option>)}

        </label>

        <button className="btn-secondary" disabled={saving}>{saving ? 'Adding…' : 'Add'}</button>
      </form>
    </div>
  );
}

  const load = useCallback(async () => {
    try {
      const [a, l] = await Promise.all([api('/api/accounts'), api('/api/levels?months=6')]);

      <div className="card">

          <h2 style={{ margin: 0 }}>Net worth</h2>
          <div className="seg">
            {[[90, '3M'], [365, '1Y'], [3650, 'All']].map(([d, l]) =>
              <button key={d} className={range === d ? 'active' : ''} onClick={() => setRange(d)}>{l}</button>)}

        <NetWorthChart series={series} />

            <button disabled={!selected.size} onClick={() => bulk({ hidden: false }, 'Unhidden')}>Unhide</button>
            <button disabled={!selected.size} onClick={() => bulk({ include_in_net_worth: false }, 'Excluded from net worth')}>Exclude from net worth</button>
            <button disabled={!selected.size} onClick={() => bulk({ include_in_net_worth: true }, 'Included in net worth')}>Include</button>
            <button disabled={!selected.size} onClick={() => bulk({ track_levels: true }, 'Added to monthly levels')}>☆ Levels</button>

          return (
            <div key={g.key}>
              <div className="group-head"><h2>{g.label}</h2><span className="sub">{fmtCents(subtotal)}</span></div>
              {list.map(a => (
                <React.Fragment key={a.id}>
                  <div className={'acct-row acct-click' + (a.hidden || !a.include_in_net_worth ? ' dim' : '')}
                       onClick={() => selecting ? (a.is_mine && toggleSel(a.id)) : setOpen(open === a.id ? null : a.id)}>
                    {selecting && <input type="checkbox" checked={selected.has(a.id)} disabled={!a.is_mine} onChange={() => toggleSel(a.id)} onClick={e => e.stopPropagation()} />}
                    <div className="acct-main">
                      <div className="acct-name">{acctName(a)}{a.mask && <span className="muted"> ••{a.mask}</span>}</div>
                      <div className="acct-meta muted">
                        {a.institution_name}
                        {a.hidden ? ' · hidden' : ''}{!a.include_in_net_worth ? ' · not in net worth' : ''}
                        {a.grp === 'credit' && a.statement_balance !== null && <> · statement {fmtCents(a.statement_balance)} due {fmtDate(a.due_date)}</>}
                        {a.holdings_count > 0 && <> · {a.holdings_count} holdings</>}
                      </div>
                    </div>
                    {a.is_mine && !selecting && <button className={'star' + (a.track_levels ? ' on' : '')} title="Show in monthly levels" aria-label="Show in monthly levels"
                      onClick={e => { e.stopPropagation(); toggleStar(a); }}>{a.track_levels ? '★' : '☆'}</button>}
                    <div className="acct-bal"><div>{fmtCents(a.current)}</div>
                      <div className="acct-meta muted">{isLiabilityGroup(a.grp) ? 'owed' : ''}</div></div>
                  </div>
                  {open === a.id && !selecting && <AccountEditor a={a} onSaved={ok} onError={fail} />}
                </React.Fragment>
              ))}
            </div>
          );
        })}
      </div>
    </>
  );

const isoDate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

// kind: week | month | year | last30; offset: 0 = current, -1 = previous, …
function periodRange(kind, offset = 0) {
  const now = new Date();
  if (kind === 'week') {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() + offset * 7);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    return { from: isoDate(start), to: isoDate(end), label: 'Week of ' + start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) };
  }
  if (kind === 'year') {
    const y = now.getFullYear() + offset;
    return { from: y + '-01-01', to: y + '-12-31', label: String(y) };
  }
  if (kind === 'last30') {
    return { from: isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29)), to: isoDate(now), label: 'Last 30 days' };
  }
  const start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const end = new Date(start.getFullYear(), start.getMonth() + 1, 0);
  return { from: isoDate(start), to: isoDate(end), label: start.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) };
}

// Categories are shared app-wide; one cached load per session, refreshed after edits.
let _catCache = null;
function useCategories() {
  const [cats, setCats] = useState(_catCache);
  const reload = useCallback(async () => {
    try { const r = await api('/api/categories'); _catCache = r.categories; setCats(r.categories); }
    catch (e) { if (!(e instanceof AuthError)) console.warn('Loading categories failed', e); }
  }, []);
  useEffect(() => { if (!_catCache) reload(); }, [reload]);
  return [cats || [], reload];
}

function CategorySelect({ cats, value, onChange, includeAll, includeUncat = true, disabled }) {
  const parents = cats.filter(c => !c.parent_id && !c.archived);
  return (
    <select value={value || ''} onChange={e => onChange(e.target.value || null)} disabled={disabled} onClick={e => e.stopPropagation()}>
      {includeAll && <option value="">All categories</option>}
      {includeUncat && <option value={includeAll ? 'uncategorized' : ''}>Uncategorized</option>}
      {!includeUncat && !includeAll && <option value="" disabled>Choose…</option>}
      {parents.map(p => (
        <optgroup key={p.id} label={p.name}>
          {includeAll && <option value={p.id}>All {p.name}</option>}
          {cats.filter(c => c.parent_id === p.id && (!c.archived || c.id === value)).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </optgroup>
      ))}
    </select>
  );
}

function Amount({ cents, transfer }) {
  const inflow = cents < 0;
  return <span className={'amt' + (inflow ? ' amt-in' : '') + (transfer ? ' amt-xfer' : '')}>{inflow ? '+' : ''}{fmtCents(Math.abs(cents))}</span>;
}

const SOURCE_TEXT = { manual: 'set by you', rule: 'from a rule', plaid: 'from Plaid', auto: 'matched as a transfer between your accounts', none: 'not categorized' };

function TransactionsView({ initialFilter }) {
  const [cats, reloadCats] = useCategories();
  const [accounts, setAccounts] = useState([]);
  const init = initialFilter || {};
  const [preset, setPreset] = useState(init.from ? 'custom' : 'last30');
  const [range, setRange] = useState(() => init.from ? { from: init.from, to: init.to } : periodRange('last30'));
  const [account, setAccount] = useState('');
  const [category, setCategory] = useState(init.category || '');
  const [search, setSearch] = useState('');
  const [q, setQ] = useState('');
  const [hideTransfers, setHideTransfers] = useState(false);
  const [data, setData] = useState(null);
  const [rows, setRows] = useState([]);
  const [loadingMore, setLoadingMore] = useState(false);
  const [open, setOpen] = useState(null);
  const [selecting, setSelecting] = useState(false);
  const [selected, setSelected] = useState(() => new Set());
  const [bulkCat, setBulkCat] = useState('');
  const [prompt, setPrompt] = useState(null);     // { text, category_id, category_name }
  const [notice, setNotice] = useState(null);

  useEffect(() => { api('/api/accounts').then(r => setAccounts(r.accounts.filter(a => !a.hidden))).catch(e => { if (!(e instanceof AuthError)) console.warn(e); }); }, []);
  useEffect(() => { const t = setTimeout(() => setQ(search.trim()), 300); return () => clearTimeout(t); }, [search]);

  const query = useCallback((offset) => {
    const p = new URLSearchParams({ from: range.from, to: range.to, limit: '100', offset: String(offset) });
    if (account) p.set('account', account);
    if (category) p.set('category', category);
    if (q) p.set('q', q);
    if (hideTransfers) p.set('transfers', 'hide');
    return api('/api/transactions?' + p.toString());
  }, [range, account, category, q, hideTransfers]);

  const load = useCallback(async () => {
    try { const r = await query(0); setData(r); setRows(r.transactions); }
    catch (e) { if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: 'Couldn’t load transactions: ' + e.message }); }
  }, [query]);
  useEffect(() => { load(); }, [load]);

  async function more() {
    setLoadingMore(true);
    try { const r = await query(rows.length); setRows(rs => rs.concat(r.transactions)); }
    catch (e) { if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: e.message }); }
    finally { setLoadingMore(false); }
  }

  function choosePreset(p) {
    setPreset(p);
    if (p !== 'custom') setRange(periodRange(p === 'thismonth' ? 'month' : p === 'lastmonth' ? 'month' : p === 'thisyear' ? 'year' : 'last30', p === 'lastmonth' ? -1 : 0));
  }

  async function setCat(t, categoryId) {
    try {
      await api('/api/transactions/' + t.id, { method: 'PATCH', body: JSON.stringify({ category_id: categoryId }) });
      const c = cats.find(x => x.id === categoryId);
      setRows(rs => rs.map(r => r.id === t.id ? { ...r, category_id: categoryId, category_name: c ? c.name : null, category_source: 'manual', is_transfer: c && c.kind === 'transfer' ? 1 : 0 } : r));
      if (categoryId) setPrompt({ text: t.merchant_name || t.name || '', category_id: categoryId, category_name: c ? c.name : '' });
      else setPrompt(null);
    } catch (e) { if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: e.message }); }
  }

  async function makeRule() {
    try {
      await api('/api/rules', { method: 'POST', body: JSON.stringify({ value: prompt.text, op: 'contains', category_id: prompt.category_id }) });
      setNotice({ kind: 'ok', text: 'Rule saved — everything matching “' + prompt.text + '” is now ' + prompt.category_name + ', including past transactions you haven’t set by hand.' });
      setPrompt(null); load();
    } catch (e) { if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: e.message }); }
  }

  async function bulkApply() {
    if (!selected.size || !bulkCat) return;
    try {
      const r = await api('/api/transactions/bulk', { method: 'POST', body: JSON.stringify({ ids: [...selected], category_id: bulkCat }) });
      setNotice({ kind: 'ok', text: 'Updated ' + r.updated + ' transaction' + (r.updated === 1 ? '' : 's') + '.' });
      setSelected(new Set()); load();
    } catch (e) { if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: e.message }); }
  }

  const toggleSel = (id) => setSelected(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  let lastDate = null;

  return (
    <div className="card">
      <div className="row-between">
        <h1 style={{ margin: 0 }}>Transactions</h1>
        <button className="btn-secondary" onClick={() => { setSelecting(v => !v); setSelected(new Set()); setOpen(null); }}>{selecting ? 'Done' : 'Select'}</button>
      </div>

      <div className="filters">
        <select value={preset} onChange={e => choosePreset(e.target.value)}>
          <option value="last30">Last 30 days</option>
          <option value="thismonth">This month</option>
          <option value="lastmonth">Last month</option>
          <option value="thisyear">This year</option>
          <option value="custom">Custom…</option>
        </select>
        {preset === 'custom' && <>
          <input type="date" value={range.from} onChange={e => e.target.value && setRange(r => ({ ...r, from: e.target.value }))} />
          <input type="date" value={range.to} onChange={e => e.target.value && setRange(r => ({ ...r, to: e.target.value }))} />
        </>}
        <select value={account} onChange={e => setAccount(e.target.value)}>
          <option value="">All accounts</option>
          {accounts.map(a => <option key={a.id} value={a.id}>{acctName(a)}{a.mask ? ' ••' + a.mask : ''}</option>)}
        </select>
        <CategorySelect cats={cats} value={category} onChange={v => setCategory(v || '')} includeAll />
        <input type="text" placeholder="Search…" value={search} onChange={e => setSearch(e.target.value)} style={{ minWidth: 140, flex: 1 }} />
        <label className="check-inline"><input type="checkbox" checked={hideTransfers} onChange={e => setHideTransfers(e.target.checked)} /> Hide transfers</label>
      </div>

      {data && <div className="muted acct-meta" style={{ marginTop: 8 }}>
        {data.total} transaction{data.total === 1 ? '' : 's'} · spent {fmtCents(data.spending)} · income {fmtCents(data.income)}
      </div>}
      {notice && <div className={notice.kind === 'err' ? 'error-box' : 'ok-box'}>{notice.text}</div>}
      {prompt && (
        <div className="rule-prompt">
          <span>Always categorize</span>
          <input type="text" value={prompt.text} onChange={e => setPrompt(p => ({ ...p, text: e.target.value }))} />
          <span>as <b>{prompt.category_name}</b>?</span>
          <button className="btn-primary btn-inline" disabled={!prompt.text.trim()} onClick={makeRule}>Yes, make a rule</button>
          <button className="btn-text" onClick={() => setPrompt(null)}>Just this one</button>
        </div>
      )}
      {selecting && (
        <div className="bulkbar">
          <span>{selected.size} selected</span>
          <CategorySelect cats={cats} value={bulkCat} onChange={v => setBulkCat(v || '')} includeUncat={false} />
          <button disabled={!selected.size || !bulkCat} onClick={bulkApply}>Set category</button>
        </div>
      )}

      {!data && !notice && <div className="spinner" style={{ margin: '24px auto' }} />}
      {data && rows.length === 0 && <div className="empty-note">No transactions match these filters.</div>}
      <div className="tx-list">
        {rows.map(t => {
          const head = t.date !== lastDate ? (lastDate = t.date) : null;
          return (
            <React.Fragment key={t.id}>
              {head && <div className="tx-date">{parseIso(t.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</div>}
              <div className={'tx-row' + (t.is_transfer ? ' dim' : '')} onClick={() => selecting ? toggleSel(t.id) : setOpen(open === t.id ? null : t.id)}>
                {selecting && <input type="checkbox" checked={selected.has(t.id)} onChange={() => toggleSel(t.id)} onClick={e => e.stopPropagation()} />}
                <div className="tx-main">
                  <div className="tx-name">{t.merchant_name || t.name}{t.pending ? <span className="pill pill-muted" style={{ marginLeft: 6 }}>pending</span> : null}</div>
                  <div className="acct-meta muted">{t.account_name}{t.account_mask ? ' ••' + t.account_mask : ''}{t.notes ? ' · ' + t.notes : ''}</div>
                </div>
                <div className="tx-cat">
                  <CategorySelect cats={cats} value={t.category_id} onChange={v => setCat(t, v)} disabled={selecting} />
                </div>
                <div className="tx-amt"><Amount cents={t.amount} transfer={t.is_transfer} /></div>
              </div>
              {open === t.id && !selecting && <TxDetail t={t} onSaved={(msg) => { setNotice({ kind: 'ok', text: msg }); load(); }} onError={(m) => setNotice({ kind: 'err', text: m })} />}
            </React.Fragment>
          );
        })}
      </div>
      {data && rows.length < data.total && (
        <div style={{ textAlign: 'center', marginTop: 12 }}>
          <button className="btn-secondary" disabled={loadingMore} onClick={more}>{loadingMore ? 'Loading…' : 'Show more (' + (data.total - rows.length) + ' left)'}</button>
        </div>
      )}
    </div>
  );
}

function TxDetail({ t, onSaved, onError }) {
  const [notes, setNotes] = useState(t.notes || '');
  const [busy, setBusy] = useState(false);
  async function saveNotes() {
    setBusy(true);
    try { await api('/api/transactions/' + t.id, { method: 'PATCH', body: JSON.stringify({ notes }) }); onSaved('Note saved.'); }
    catch (e) { if (!(e instanceof AuthError)) onError(e.message); }
    finally { setBusy(false); }
  }
  async function reset() {
    setBusy(true);
    try { await api('/api/transactions/' + t.id + '/reset', { method: 'POST' }); onSaved('Category reset to automatic.'); }
    catch (e) { if (!(e instanceof AuthError)) onError(e.message); }
    finally { setBusy(false); }
  }
  return (
    <div className="editor" onClick={e => e.stopPropagation()}>
      <div className="acct-meta muted">
        {t.name}{t.merchant_name && t.merchant_name !== t.name ? '' : ''} · {fmtDate(t.date)}
        {t.pfc_detailed ? ' · Plaid: ' + t.pfc_detailed.toLowerCase().replace(/_/g, ' ') : ''}
        {' · category ' + (SOURCE_TEXT[t.category_source] || '')}
      </div>
      <label>Note <input type="text" value={notes} maxLength={500} onChange={e => setNotes(e.target.value)} placeholder="e.g. split with Christine" /></label>
      <div className="btn-row">
        <button className="btn-primary btn-inline" disabled={busy} onClick={saveNotes}>Save note</button>
        {t.category_source === 'manual' && <button className="btn-text" disabled={busy} onClick={reset}>Use automatic category</button>}
      </div>
    </div>
  );
}

function ReportsView({ onDrill }) {
  const [kind, setKind] = useState('month');
  const [offset, setOffset] = useState(0);
  const [custom, setCustom] = useState(() => periodRange('month'));
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const range = kind === 'custom' ? { ...custom, label: fmtDate(custom.from) + ' – ' + fmtDate(custom.to) } : periodRange(kind, offset);

  useEffect(() => {
    let live = true;
    setData(null);
    api('/api/reports/summary?from=' + range.from + '&to=' + range.to)
      .then(r => { if (live) { setData(r); setErr(null); } })
      .catch(e => { if (live && !(e instanceof AuthError)) setErr(e.message); });
    return () => { live = false; };
  }, [range.from, range.to]);

  // Group categories under their parent.
  const groups = [];
  if (data) {
    const byParent = new Map();
    for (const c of data.by_category) {
      const key = c.parent_id || (c.category_id ? c.category_id : 'none');
      const label = c.parent_name || c.name || 'Uncategorized';
      if (!byParent.has(key)) byParent.set(key, { id: c.parent_id || c.category_id, label, total: 0, children: [] });
      const g = byParent.get(key);
      g.total += c.total;
      if (c.parent_id) g.children.push(c);
    }
    groups.push(...[...byParent.values()].filter(g => g.total > 0 || g.children.length).sort((a, b) => b.total - a.total));
  }
  const maxGroup = Math.max(1, ...groups.map(g => g.total));
  const maxMonth = data ? Math.max(1, ...data.months.map(m => m.spending)) : 1;

  return (
    <>
      <div className="card">
        <div className="row-between">
          <div className="seg">
            {[['week', 'Week'], ['month', 'Month'], ['year', 'Year'], ['custom', 'Custom']].map(([k, l]) =>
              <button key={k} className={kind === k ? 'active' : ''} onClick={() => { setKind(k); setOffset(0); }}>{l}</button>)}
          </div>
          {kind !== 'custom' ? (
            <div className="period-nav">
              <button className="btn-text" aria-label="Previous" onClick={() => setOffset(o => o - 1)}>‹</button>
              <b>{range.label}</b>
              <button className="btn-text" aria-label="Next" disabled={offset >= 0} onClick={() => setOffset(o => o + 1)}>›</button>
            </div>
          ) : (
            <div className="btn-row">
              <input type="date" value={custom.from} onChange={e => e.target.value && setCustom(c => ({ ...c, from: e.target.value }))} />
              <input type="date" value={custom.to} onChange={e => e.target.value && setCustom(c => ({ ...c, to: e.target.value }))} />
            </div>
          )}
        </div>
      </div>

      {err && <div className="error-box">{err}</div>}
      {!data && !err && <div className="card"><div className="spinner" style={{ margin: '24px auto' }} /></div>}
      {data && <>
        <div className="tiles" style={{ marginTop: 16 }}>
          <div className="tile tile-hero"><div className="tile-label">Spent</div><div className="tile-value">{fmtCents(data.spending)}</div></div>
          <div className="tile"><div className="tile-label">Income</div><div className="tile-value">{fmtCents(data.income)}</div></div>
          <div className="tile"><div className="tile-label">Income − spending</div><div className="tile-value">{fmtCents(data.income - data.spending)}</div></div>
        </div>
        {data.uncategorized > 0 && (
          <div className="warn-box" style={{ marginBottom: 16 }}>
            {data.uncategorized} transaction{data.uncategorized === 1 ? '' : 's'} in this period {data.uncategorized === 1 ? 'is' : 'are'} uncategorized.{' '}
            <a href="#" onClick={e => { e.preventDefault(); onDrill({ category: 'uncategorized', from: range.from, to: range.to }); }}>Review them</a>
          </div>
        )}

        <div className="card">
          <h2>Spending by category</h2>
          {groups.length === 0 && <div className="empty-note">No spending in this period.</div>}
          {groups.map(g => (
            <div key={g.label} className="rep-group">
              <div className="rep-row rep-parent" onClick={() => onDrill({ category: g.id || 'uncategorized', from: range.from, to: range.to })}>
                <span className="rep-label">{g.label}</span>
                <span className="rep-bar"><span style={{ width: Math.max(0, g.total) / maxGroup * 100 + '%' }} /></span>
                <span className="rep-val">{fmtCents(g.total)}</span>
              </div>
              {g.children.length > 0 && g.children.sort((a, b) => b.total - a.total).map(c => (
                <div key={c.category_id} className="rep-row rep-child" onClick={() => onDrill({ category: c.category_id, from: range.from, to: range.to })}>
                  <span className="rep-label">{c.name}</span>
                  <span className="rep-bar"><span style={{ width: Math.max(0, c.total) / maxGroup * 100 + '%' }} /></span>
                  <span className="rep-val">{fmtCents(c.total)}</span>
                </div>
              ))}
            </div>
          ))}
          <p className="muted acct-meta" style={{ marginBottom: 0 }}>Transfers between your accounts, card payments and income aren’t counted as spending. Click any row to see its transactions.</p>
        </div>

        <div className="card">
          <h2>Spending by month</h2>
          <div className="month-bars" role="img" aria-label="Monthly spending, last 12 months">
            {data.months.map(m => (
              <div key={m.month} className="mbar" data-tip={monthLabel(m.month).replace(' 1', '') + ': spent ' + fmtCents(m.spending) + ' · income ' + fmtCents(m.income)}>
                <div className="mbar-track"><div className="mbar-fill" style={{ height: Math.max(0, m.spending) / maxMonth * 100 + '%' }} /></div>
                <div className="mbar-label">{parseIso(m.month + '-01').toLocaleDateString('en-US', { month: 'short' })}</div>
              </div>
            ))}
          </div>
          {data.months.length < 2 && <p className="muted acct-meta">This fills in as more months of history load.</p>}
        </div>

        <div className="card">
          <h2>Top merchants</h2>
          {data.merchants.length === 0 && <div className="empty-note">No spending in this period.</div>}
          {data.merchants.map(m => (
            <div key={m.merchant} className="acct-row">
              <div className="acct-main"><div className="acct-name">{m.merchant}</div><div className="acct-meta muted">{m.n} transaction{m.n === 1 ? '' : 's'}</div></div>
              <div className="acct-bal">{fmtCents(m.total)}</div>
            </div>
          ))}
        </div>
      </>}
    </>
  );
}

function CategoriesAndRules() {
  const [cats, reloadCats] = useCategories();
  const [rules, setRules] = useState([]);
  const [notice, setNotice] = useState(null);
  const [adding, setAdding] = useState(null);       // parent id
  const [newName, setNewName] = useState('');
  const [editing, setEditing] = useState(null);     // { id, name }
  const [ruleForm, setRuleForm] = useState({ value: '', op: 'contains', category_id: '' });
  const [busy, setBusy] = useState(false);

  const loadRules = useCallback(async () => {
    try { setRules((await api('/api/rules')).rules); }
    catch (e) { if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: e.message }); }
  }, []);
  useEffect(() => { loadRules(); reloadCats(); }, [loadRules, reloadCats]);
  const run = async (fn, okText) => {
    setBusy(true);
    try { await fn(); if (okText) setNotice({ kind: 'ok', text: okText }); await reloadCats(); await loadRules(); }
    catch (e) { if (!(e instanceof AuthError)) setNotice({ kind: 'err', text: e.message }); }
    finally { setBusy(false); }
  };

  const parents = cats.filter(c => !c.parent_id);
  return (
    <>
      <div className="card">
        <h1>Categories</h1>
        {notice && <div className={notice.kind === 'err' ? 'error-box' : 'ok-box'}>{notice.text}</div>}
        {parents.map(p => (
          <div key={p.id} style={{ marginBottom: 14 }}>
            <div className="group-head"><h2>{p.name}</h2><span className="muted acct-meta">{p.kind === 'expense' ? '' : p.kind === 'income' ? 'income' : 'not counted as spending'}</span></div>
            <div className="chips">
              {cats.filter(c => c.parent_id === p.id && !c.archived).map(c => (
                editing && editing.id === c.id ? (
                  <span key={c.id} className="chip editing">
                    <input type="text" value={editing.name} autoFocus onChange={e => setEditing({ ...editing, name: e.target.value })}
                      onKeyDown={e => { if (e.key === 'Enter') run(() => api('/api/categories/' + c.id, { method: 'PATCH', body: JSON.stringify({ name: editing.name }) }), 'Renamed.').then(() => setEditing(null)); if (e.key === 'Escape') setEditing(null); }} />
                    <button className="btn-text" disabled={busy} onClick={() => run(() => api('/api/categories/' + c.id, { method: 'PATCH', body: JSON.stringify({ name: editing.name }) }), 'Renamed.').then(() => setEditing(null))}>Save</button>
                    <button className="btn-text" disabled={busy} onClick={() => run(() => api('/api/categories/' + c.id, { method: 'PATCH', body: JSON.stringify({ archived: true }) }), c.name + ' archived — its past transactions keep the label.').then(() => setEditing(null))}>Archive</button>
                  </span>
                ) : <button key={c.id} className="chip" onClick={() => setEditing({ id: c.id, name: c.name })}>{c.name}</button>
              ))}
              {adding === p.id ? (
                <span className="chip editing">
                  <input type="text" value={newName} autoFocus placeholder="New category" onChange={e => setNewName(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter' && newName.trim()) run(() => api('/api/categories', { method: 'POST', body: JSON.stringify({ name: newName, parent_id: p.id }) }), 'Added ' + newName + '.').then(() => { setAdding(null); setNewName(''); }); if (e.key === 'Escape') setAdding(null); }} />
                  <button className="btn-text" disabled={busy || !newName.trim()} onClick={() => run(() => api('/api/categories', { method: 'POST', body: JSON.stringify({ name: newName, parent_id: p.id }) }), 'Added ' + newName + '.').then(() => { setAdding(null); setNewName(''); })}>Add</button>
                </span>
              ) : <button className="chip chip-add" onClick={() => { setAdding(p.id); setNewName(''); }}>+ Add</button>}
            </div>
          </div>
        ))}
        <p className="muted acct-meta" style={{ marginBottom: 0 }}>Click a category to rename or archive it.</p>
      </div>

      <div className="card">
        <div className="row-between">
          <h1 style={{ margin: 0 }}>Rules</h1>
          <button className="btn-secondary" disabled={busy} onClick={() => run(async () => {
            const r = await api('/api/categorize/rerun', { method: 'POST' });
            setNotice({ kind: 'ok', text: 'Re-applied rules and Plaid categories to all history. ' + r.uncategorized + ' transaction' + (r.uncategorized === 1 ? '' : 's') + ' left uncategorized.' });
          })}>Re-apply to all history</button>
        </div>
        <p className="muted acct-meta">Rules run before Plaid’s guess and never override a category you set by hand. The first matching rule wins.</p>
        {rules.length === 0 && <div className="muted acct-meta">No rules yet. Pick a category on any transaction and Finance Pal will offer to make one.</div>}
        {rules.map(r => (
          <div key={r.id} className="acct-row">
            <div className="acct-main">
              <div>Text {r.op === 'equals' ? 'is' : r.op === 'starts_with' ? 'starts with' : 'contains'} “<b>{r.value}</b>” → <b>{r.category_name}</b></div>
              {r.account_name && <div className="acct-meta muted">only on {r.account_name}</div>}
            </div>
            <button className="btn-text" disabled={busy} onClick={() => run(() => api('/api/rules/' + r.id, { method: 'DELETE' }), 'Rule deleted. Use “Re-apply to all history” to undo its effect on past transactions.')}>Delete</button>
          </div>
        ))}
        <form className="inline-form" onSubmit={e => { e.preventDefault(); run(() => api('/api/rules', { method: 'POST', body: JSON.stringify(ruleForm) }), 'Rule added and applied to history.').then(() => setRuleForm({ value: '', op: 'contains', category_id: '' })); }}>
          <label>When text
            <select value={ruleForm.op} onChange={e => setRuleForm(f => ({ ...f, op: e.target.value }))}>
              <option value="contains">contains</option><option value="starts_with">starts with</option><option value="equals">is exactly</option>
            </select>
          </label>
          <label>Text<input type="text" value={ruleForm.value} placeholder="e.g. pacific gardens" onChange={e => setRuleForm(f => ({ ...f, value: e.target.value }))} /></label>
          <label>Category<CategorySelect cats={cats} value={ruleForm.category_id} onChange={v => setRuleForm(f => ({ ...f, category_id: v || '' }))} includeUncat={false} /></label>
          <button className="btn-secondary" disabled={busy || !ruleForm.value.trim() || !ruleForm.category_id}>Add rule</button>
        </form>
      </div>
    </>
  );
}
